<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3 - Articles</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/public/ex3.js" defer></script>
</head>
<body>
  <h1><a href="/">Link to Start Page</a></h1>
  <h2>My Articles/Form Solution</h2>
  <h2>Add new article</h2>
  <form id="articleForm" action="/articles" method="POST">
    <p>
      <label for="title">Title:</label>
      <input type="text" id="title" name="title">
    </p>
    <p>
      <label for="content">Content:</label><br>
      <textarea id="content" name="content" rows="8" cols="30"></textarea>
    </p>
    <button type="submit">Add</button>
  </form>
  <div id="message"></div>
</body>
</html>
